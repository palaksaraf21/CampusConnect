<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Event - CampusConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <section class="admin-login-section">

        <div class="admin-login-box">

            <p class="small-title">
                ADMIN PANEL
            </p>

            <h1>Edit Event</h1>

            <p>
                Update the event details below.
            </p>

            <form method="POST">

                <input
                    type="text"
                    name="name"
                    value="{{ event.name }}"
                    placeholder="Event Name"
                    required
                >

                <input
                    type="text"
                    name="category"
                    value="{{ event.category }}"
                    placeholder="Category"
                    required
                >

                <input
                    type="text"
                    name="date"
                    value="{{ event.date }}"
                    placeholder="Date"
                    required
                >

                <textarea
                    name="description"
                    placeholder="Event Description"
                    required
                >{{ event.description }}</textarea>

                <button type="submit">
                    Update Event
                </button>

            </form>

            <br>

            <a href="/admin/dashboard">
                Back to Dashboard
            </a>

        </div>

    </section>

</body>

</html>
